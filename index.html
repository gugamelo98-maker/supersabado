<title>Super Sábado G7</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap">

<style>
/* Layout: full-app, sticky header, tab-routed views */
:root {
  --coral: #E8502A;
  --teal: #3FBFB0;
  --sand: #F5F0E8;
  --dark: #1A1A1A;
  --mid: #444444;
  --soft: #888888;
  --line: #E0DAD0;
  --card: #FFFFFF;
  --badge-m: #2B6CB0;
  --badge-f: #9B2C9B;
  --badge-mix: #2D7D32;
  --con: #B45309;
  --bg: var(--sand);
  --fg: var(--dark);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18181B;
    --fg: #F0EDE6;
    --card: #27272A;
    --line: #3F3F46;
    --soft: #A1A1AA;
    --mid: #D4D4D8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18181B;
  --fg: #F0EDE6;
  --card: #27272A;
  --line: #3F3F46;
  --soft: #A1A1AA;
  --mid: #D4D4D8;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Barlow', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 0;
  padding-block: 0;
  overflow-x: hidden;
}

/* ── HEADER ── */
.site-header {
  background: var(--coral);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 56px;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.logo-img {
  width: 42px; height: 42px;
  border-radius: 50%;
  flex-shrink: 0;
  object-fit: cover;
  border: 2px solid rgba(255,255,255,.3);
  background: #fff;
}
.header-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 20px;
  color: #fff;
  letter-spacing: .5px;
  line-height: 1.1;
}
.header-title small {
  display: block;
  font-size: 11px; font-weight: 600;
  letter-spacing: 2px;
  opacity: .85;
  text-transform: uppercase;
}
.header-spacer { flex: 1; }
.nav-tabs {
  display: flex; gap: 2px;
}
.nav-tab {
  background: rgba(255,255,255,.15);
  border: none; border-radius: 6px;
  color: #fff; font-family: 'Barlow', sans-serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: .5px;
  padding: 5px 12px;
  cursor: pointer;
  transition: background .15s;
}
.nav-tab:hover { background: rgba(255,255,255,.25); }
.nav-tab.active { background: rgba(255,255,255,.35); }

/* ── VIEWS ── */
.view { display: none; max-width: 780px; margin: 0 auto; padding: 24px 16px 48px; }
.view.active { display: block; }

/* ── HERO ── */
.hero {
  background: linear-gradient(135deg, var(--coral) 0%, #c0402a 60%, var(--teal) 100%);
  border-radius: 16px;
  padding: 32px 24px;
  color: #fff;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 150px; height: 150px;
  border-radius: 50%;
  border: 24px solid rgba(255,255,255,.08);
}
.hero::after {
  content: '';
  position: absolute;
  right: 30px; top: 30px;
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 14px solid rgba(255,255,255,.08);
}
.hero-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: .85;
  margin-bottom: 6px;
}
.hero h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 42px;
  margin: 0 0 4px; line-height: 1;
  text-wrap: balance;
}
.hero-sub {
  font-size: 14px; opacity: .88;
  margin-bottom: 20px;
}
.hero-stats {
  display: flex; gap: 20px; flex-wrap: wrap;
}
.stat {
  display: flex; flex-direction: column;
}
.stat-n {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px; font-weight: 900; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stat-l { font-size: 11px; opacity: .8; text-transform: uppercase; letter-spacing: 1px; }

/* ── FORM ── */
.form-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
}
.form-card h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px; font-weight: 700;
  margin: 0 0 18px;
  color: var(--fg);
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--soft);
  margin-bottom: 5px;
}
.field input, .field select {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 8px;
  color: var(--fg);
  font-family: 'Barlow', sans-serif;
  font-size: 15px;
  padding: 10px 12px;
  transition: border-color .15s;
  appearance: none;
}
.field input:focus, .field select:focus {
  outline: none;
  border-color: var(--coral);
}
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .field-row { grid-template-columns: 1fr; } }

.cat-cards {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
@media (max-width: 460px) { .cat-cards { grid-template-columns: 1fr; } }

.cat-card {
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: border-color .15s, background .15s;
  background: var(--bg);
}
.cat-card:hover { border-color: var(--coral); }
.cat-card.sel { border-color: var(--coral); background: color-mix(in srgb, var(--coral) 8%, var(--bg)); }
.cat-card input[type=radio] { display: none; }
.cat-dot {
  width: 14px; height: 14px; border-radius: 50%;
  flex-shrink: 0;
}
.cat-dot.m { background: var(--badge-m); }
.cat-dot.f { background: var(--badge-f); }
.cat-name { font-weight: 600; font-size: 14px; }
.cat-desc { font-size: 12px; color: var(--soft); }

.submit-btn {
  width: 100%;
  background: var(--coral);
  border: none; border-radius: 10px;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px; font-weight: 700;
  letter-spacing: .5px;
  padding: 14px;
  cursor: pointer;
  margin-top: 4px;
  transition: opacity .15s, transform .1s;
}
.submit-btn:hover { opacity: .92; }
.submit-btn:active { transform: scale(.99); }
.submit-btn:disabled { opacity: .5; cursor: not-allowed; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #1A1A1A; color: #fff;
  padding: 12px 20px; border-radius: 10px;
  font-size: 14px; font-weight: 500;
  z-index: 999;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { background: #2D7D32; }
.toast.err { background: #C62828; }

/* ── ADMIN LIST ── */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-head h2 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 700; margin: 0;
}
.pill {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .8px;
  padding: 3px 9px; border-radius: 20px;
}
.pill.m { background: color-mix(in srgb, var(--badge-m) 15%, transparent); color: var(--badge-m); }
.pill.f { background: color-mix(in srgb, var(--badge-f) 15%, transparent); color: var(--badge-f); }
.pill.mix { background: color-mix(in srgb, var(--badge-mix) 15%, transparent); color: var(--badge-mix); }
.pill.con { background: color-mix(in srgb, var(--con) 15%, transparent); color: var(--con); }
.pill.num { background: var(--line); color: var(--mid); }

.player-list { display: flex; flex-direction: column; gap: 6px; }
.player-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
}
.player-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 14px;
  color: var(--soft);
  width: 22px; flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.player-name { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; }
.player-contact { font-size: 12px; color: var(--soft); }

.action-btn {
  background: var(--teal);
  border: none; border-radius: 8px;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 700;
  letter-spacing: .3px;
  padding: 10px 18px;
  cursor: pointer;
  transition: opacity .15s;
}
.action-btn:hover { opacity: .88; }
.action-btn.danger { background: var(--coral); }
.action-btn.outline {
  background: transparent;
  border: 1.5px solid var(--line);
  color: var(--fg);
}
.action-btn:disabled { opacity: .4; cursor: not-allowed; }

.warn-box {
  background: color-mix(in srgb, var(--con) 10%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--con) 30%, transparent);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px; color: var(--mid);
  margin-bottom: 16px;
}

/* ── GROUPS / BRACKET ── */
.phase-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px;
  color: var(--soft);
  margin: 28px 0 12px;
}
.groups-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
  margin-bottom: 8px;
  align-items: start;
}
.group-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.group-header {
  padding: 8px 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.group-header.m { background: color-mix(in srgb, var(--badge-m) 15%, var(--card)); color: var(--badge-m); }
.group-header.f { background: color-mix(in srgb, var(--badge-f) 15%, var(--card)); color: var(--badge-f); }
.group-header.mix { background: color-mix(in srgb, var(--badge-mix) 15%, var(--card)); color: var(--badge-mix); }
.group-header.con { background: color-mix(in srgb, var(--con) 15%, var(--card)); color: var(--con); }
.group-players { padding: 4px 0; }
.group-player {
  padding: 7px 12px;
  font-size: 13px; font-weight: 500;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 6px;
}
.group-player:last-child { border-bottom: none; }
.rank-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700;
  width: 16px; height: 16px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  background: var(--line); color: var(--soft);
  flex-shrink: 0;
}
.rank-badge.r1 { background: var(--teal); color: #fff; }
.rank-badge.r2 { background: color-mix(in srgb, var(--teal) 40%, transparent); color: var(--teal); }

.match-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 8px;
}
.match-header {
  padding: 6px 12px;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: var(--soft);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
}
.match-players {
  padding: 0;
}
.match-player {
  padding: 9px 12px;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500;
  border-bottom: 1px solid var(--line);
}
.match-player:last-child { border-bottom: none; }
.vs-divider {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700;
  color: var(--soft);
  text-align: center;
  padding: 2px;
  background: var(--line);
  letter-spacing: 1px;
}

/* ── BRACKET ── */
.bracket-wrap {
  display: flex;
  gap: 0;
  overflow-x: auto;
  padding-bottom: 12px;
}
.bracket-round {
  flex: 1;
  min-width: 200px;
  max-width: 280px;
}
.bracket-round-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--soft);
  text-align: center;
  padding: 6px 8px 8px;
  border-bottom: 2px solid var(--line);
  margin-bottom: 12px;
}
.bracket-matches {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 0 8px;
  justify-content: space-around;
  height: 100%;
}
.bracket-match {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color .2s;
}
.bracket-match.played { border-color: var(--teal); }
.bracket-match.bye-match { opacity: .6; }
.bracket-slot {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  min-height: 38px;
}
.bracket-slot:last-child { border-bottom: none; }
.bracket-slot.won {
  background: color-mix(in srgb, var(--teal) 12%, var(--card));
}
.bracket-slot.lost { opacity: .5; }
.bracket-slot.bye {
  opacity: .4;
  font-style: italic;
}
.slot-name {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bracket-slot.won .slot-name { color: var(--teal); }
.slot-win-btn {
  background: var(--teal);
  border: none;
  border-radius: 5px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  width: 26px; height: 26px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s;
}
.slot-win-btn:hover { opacity: .85; }
.slot-win-btn:disabled { opacity: .3; cursor: default; }
.bracket-vs {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 700;
  color: var(--soft);
  text-align: center;
  padding: 1px 0;
  background: var(--line);
  letter-spacing: 1px;
}

.bracket-score-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 4px 6px;
  background: var(--bg2);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.bscore-in {
  width: 42px;
  padding: 3px 4px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  -moz-appearance: textfield;
}
.bscore-in::-webkit-outer-spin-button,
.bscore-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.bscore-in:focus { outline: none; border-color: var(--teal); }
.slot-ok-btn {
  background: var(--teal);
  border: none;
  border-radius: 5px;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 8px;
  cursor: pointer;
  transition: opacity .15s;
}
.slot-ok-btn:hover { opacity: .85; }
.slot-score-badge {
  font-size: 11px;
  font-weight: 700;
  color: var(--teal);
  margin-left: auto;
  flex-shrink: 0;
}

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--soft);
}
.empty-icon {
  font-size: 48px; margin-bottom: 12px;
}
.empty-state p { margin: 0; font-size: 14px; }

.admin-bar {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;
}

.confirm-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.confirm-box {
  background: var(--card);
  border-radius: 14px;
  padding: 24px;
  max-width: 360px; width: 100%;
  text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
}
.confirm-box h3 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 700;
  margin: 0 0 8px;
}
.confirm-box p { font-size: 14px; color: var(--mid); margin: 0 0 20px; }
.confirm-btns { display: flex; gap: 10px; }
.confirm-btns button { flex: 1; }

.loading { color: var(--soft); font-size: 14px; padding: 24px 0; text-align: center; }

/* ── SCORE INPUTS ── */
.score-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border-bottom: 1px solid var(--line);
}
.score-row:last-child { border-bottom: none; }
.score-row .player-label { flex: 1; font-size: 13px; font-weight: 500; min-width: 0; }
.score-input {
  width: 48px;
  text-align: center;
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 6px;
  color: var(--fg);
  font-size: 15px; font-weight: 700;
  padding: 4px 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-variant-numeric: tabular-nums;
}
.score-input:focus { outline: none; border-color: var(--coral); }

.winner-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .8px;
  color: var(--teal);
  padding: 3px 7px; border-radius: 20px;
  background: color-mix(in srgb, var(--teal) 12%, transparent);
}
</style>

<script>
// ── CONFIG ──
const API = 'https://rarelookingorca-n8n.cloudfy.live/webhook';

// ── STATE ──
let players = [];
let groups = null;   // { fase1: {M, F}, fase2: [...], consolacao: [...] }
let adminMode = false;
let currentPhase = 'inscritos';
let pollTimer = null;

// ── API HELPERS ──
async function apiGet(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('API error ' + r.status);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('API error ' + r.status);
  return r.json();
}
async function apiDel(path) {
  const r = await fetch(API + path, { method: 'DELETE' });
  if (!r.ok) throw new Error('API error ' + r.status);
  return r.json();
}

// ── INIT ──
function anyJogosOpen() {
  return [...document.querySelectorAll('[id^="jogos-"]')].some(e => e.style.display !== 'none');
}

async function loadData() {
  if (anyJogosOpen()) return; // don't disrupt while admin is filling scores
  try {
    const rows = await apiGet('/g7/atletas');
    players = rows.map(r => ({ id: r.id, nome: r.nome, tel: r.whatsapp, cat: r.categoria }));
    updateStats();
    if (adminMode) renderInscritos();

    const gRows = await apiGet('/g7/grupos');
    if (gRows.length > 0) {
      groups = parseGroups(gRows);
    } else {
      groups = null;
    }
    if (adminMode && (currentPhase === 'fase1' || currentPhase === 'fase2')) renderCurrentPhase();
  } catch(e) { console.warn('load error', e); }
}

function parseGroups(rows) {
  const g = { fase1: { M: [], F: [] }, fase2: [], consolacao: [] };
  // fase1
  const f1 = rows.filter(r => r.fase === 'fase1');
  const byTipoIdx = {};
  for (const r of f1) {
    const key = r.tipo + '_' + r.grupo_idx;
    if (!byTipoIdx[key]) byTipoIdx[key] = { tipo: r.tipo, idx: r.grupo_idx, players: [] };
    byTipoIdx[key].players[r.posicao - 1] = r;
  }
  for (const grp of Object.values(byTipoIdx)) {
    const arr = grp.tipo === 'M' ? g.fase1.M : g.fase1.F;
    arr[grp.idx] = grp.players.filter(Boolean);
  }
  // fase2
  const f2 = rows.filter(r => r.fase === 'fase2');
  const f2byIdx = {};
  for (const r of f2) {
    if (!f2byIdx[r.grupo_idx]) f2byIdx[r.grupo_idx] = { idx: r.grupo_idx, players: [] };
    f2byIdx[r.grupo_idx].players[r.posicao - 1] = r;
  }
  g.fase2 = Object.values(f2byIdx).sort((a, b) => a.idx - b.idx).map(grp => ({
    label: `Jogo ${grp.idx + 1}`,
    grupo_idx: grp.idx,
    p1: grp.players[0],
    p2: grp.players[1],
    winner: grp.players.find(p => p?.vencedor) || null,
  }));
  // consolação
  const con = rows.filter(r => r.fase === 'consolacao');
  const conByIdx = {};
  for (const r of con) {
    if (!conByIdx[r.grupo_idx]) conByIdx[r.grupo_idx] = [];
    conByIdx[r.grupo_idx][r.posicao - 1] = r;
  }
  g.consolacao = Object.values(conByIdx).map(arr => arr.filter(Boolean));
  return g;
}

(async () => {
  await loadData();
  // Poll every 10s for live updates
  pollTimer = setInterval(loadData, 10000);
})();

// ── STATS ──
function updateStats() {
  const m = players.filter(p => p.cat === 'M').length;
  const f = players.filter(p => p.cat === 'F').length;
  document.getElementById('stat-total').textContent = players.length;
  document.getElementById('stat-m').textContent = m;
  document.getElementById('stat-f').textContent = f;
}

// ── NAV ──
function switchView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.toggle('active', el.dataset.view === v));
  document.getElementById('view-' + v).classList.add('active');
}

// ── FORM ──
document.querySelectorAll('.cat-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('sel'));
    card.classList.add('sel');
  });
});

async function submitReg(e) {
  e.preventDefault();
  const nome = document.getElementById('f-nome').value.trim();
  const tel = document.getElementById('f-tel').value.trim();
  const cat = document.querySelector('input[name=cat]:checked')?.value;
  if (!nome || !tel || !cat) { showToast('Preencha todos os campos', 'err'); return; }

  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Inscrevendo…';

  try {
    const existing = players.find(p => p.tel === tel);
    if (existing) { showToast('Esse WhatsApp já está inscrito!', 'err'); btn.disabled = false; btn.textContent = 'Confirmar Inscrição'; return; }

    await apiPost('/g7/atletas', { nome, whatsapp: tel, categoria: cat });
    await loadData();
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = 'block';

// ── SORTEIO ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeGroups(list) {
  const shuffled = shuffle(list);
  const grps = [];
  for (let i = 0; i < shuffled.length; i += 4) {
    grps.push(shuffled.slice(i, Math.min(i + 4, shuffled.length)));
  }
  return grps;
}

// ── SCORES (localStorage) ──
function scoreKey(tipo, grupoIdx, p1, p2) {
  return `g7_sc_${tipo}_${grupoIdx}_${p1}_${p2}`;
}
function getScore(tipo, grupoIdx, p1, p2) {
  try { return JSON.parse(localStorage.getItem(scoreKey(tipo, grupoIdx, p1, p2))) || null; } catch { return null; }
}
function setScore(tipo, grupoIdx, p1, p2, s1, s2) {
  try { localStorage.setItem(scoreKey(tipo, grupoIdx, p1, p2), JSON.stringify({ s1, s2 })); } catch {}
}

// 3 dupla-matchups for 4 players: (0+1 vs 2+3), (0+2 vs 1+3), (0+3 vs 1+2)
const DUPLA_MATCHUPS = [[0,1,2,3],[0,2,1,3],[0,3,1,2]];

// Compute game-diff ranking for a group (duplas format)
function calcRanking(group, tipo, idx) {
  const pts = new Array(group.length).fill(0);
  DUPLA_MATCHUPS.forEach(([a,b,c,d], mi) => {
    const sc = getScore(tipo, idx, mi, 0); // key: matchup index
    if (sc !== null) {
      const s1 = parseInt(sc.s1) || 0, s2 = parseInt(sc.s2) || 0;
      const diff1 = s1 - s2, diff2 = s2 - s1;
      pts[a] += diff1; pts[b] += diff1;
      pts[c] += diff2; pts[d] += diff2;
    }
  });
  return pts;
}

    : 'Sorteio: 1°s masculino + 1°s feminino (aleatório), 2°s idem. 3°s e 4°s vão à Consolação.';

// ── BRACKET HELPERS ──
// Builds a single-elimination bracket from an array of duplas (matches)
// Each dupla = { label, grupo_idx, p1, p2, winner }
// Returns rounds: [ [ {matchIdx, dupla}... ] ... ]
// bracket is built from the ordered duplas as seeds
function buildBracket(duplas) {
  const n = duplas.length;
  if (n === 0) return [];
  // Find next power of 2 >= n
  let size = 1;
  while (size < n) size *= 2;
  // Seed slots: [seed0, seed1, ..., sizeN-1] — some may be null (BYE)
  const seeds = [];
  for (let i = 0; i < size; i++) seeds.push(duplas[i] || null);
  const rounds = [];
  let currentSlots = seeds;
  while (currentSlots.length > 1) {
    const roundMatches = [];
    for (let i = 0; i < currentSlots.length; i += 2) {
      roundMatches.push([currentSlots[i], currentSlots[i+1]]);
    }
    rounds.push(roundMatches);
    // Advance winners to next round
    currentSlots = roundMatches.map(([a, b]) => {
      // If one is BYE, the other auto-advances
      if (!a) return b;
      if (!b) return a;
      // If both present, winner advances (or null placeholder if no winner yet)
      const w = (a && a.winner) ? a.winner : (b && b.winner) ? b.winner : null;
      return w ? (a?.winner ? a : b) : null;
    });
  }
  return rounds;
}

function dupNome(d) {
  if (!d) return 'BYE';
  const m = d.p1?.nome || '?';
  const f = d.p2?.nome || '?';
  return `${m} / ${f}`;
}

// ── PLACAR LOCAL (eliminatórias) ──
// key: `${fase}_${grupo_idx}` → { sa, sb }
const bracketScores = {};
function getBScore(fase, gi) { return bracketScores[`${fase}_${gi}`] || { sa: '', sb: '' }; }
function setBScore(fase, gi, sa, sb) { bracketScores[`${fase}_${gi}`] = { sa, sb }; }

// ── RENDER CONSOLAÇÃO (aba separada) ──
function renderConsolacao() {
  const el = document.getElementById('phase-consolacao');
  if (!groups?.consolacao?.length) {
    el.innerHTML = `<div class="warn-box">Consolação não gerada ainda. Avance a partir da Fase 1.</div>`;
    return;
  }
  const conDuplas = groups.consolacao.map((arr, i) => ({
    label: `C${i+1}`, grupo_idx: i,
    p1: arr[0] || null, p2: arr[1] || null,
    winner: arr.find(p => p?.vencedor) || null,
  }));
  let html = `<div class="phase-title">🥉 Chave Consolação</div>`;
  html += renderBracket(conDuplas, 'consolacao');
  el.innerHTML = html;
}

function renderBracket(duplas, fase) {
  const rounds = buildBracket(duplas);
  if (!rounds.length) return '';
  const roundNames = ['Oitavas', 'Quartas', 'Semifinal', 'Final'];
  const offset = Math.max(0, roundNames.length - rounds.length);

  let html = `<div class="bracket-wrap">`;
  rounds.forEach((matches, ri) => {
    const isFirstRound = ri === 0;
    const rName = roundNames[offset + ri] || `Rodada ${ri + 1}`;
    html += `<div class="bracket-round">
      <div class="bracket-round-title">${rName}</div>
      <div class="bracket-matches">`;

    matches.forEach(([a, b]) => {
      const aWon = a && b && a.winner;
      const bWon = a && b && b.winner;
      const aIsBye = !a;
      const bIsBye = !b;
      const nameA = aIsBye ? 'BYE' : dupNome(a);
      const nameB = bIsBye ? 'BYE' : dupNome(b);
      const sc = isFirstRound && a ? getBScore(fase, a.grupo_idx) : { sa: '', sb: '' };
      const scoreKey = isFirstRound && a ? `${fase}_${a.grupo_idx}` : '';

      html += `<div class="bracket-match ${aWon || bWon ? 'played' : ''} ${aIsBye || bIsBye ? 'bye-match' : ''}">
        <div class="bracket-slot ${aWon ? 'won' : ''} ${bWon ? 'lost' : ''} ${aIsBye ? 'bye' : ''}">
          <span class="slot-name">${esc(nameA)}</span>
          ${aWon ? `<span class="slot-score-badge">${sc.sa}</span>` : ''}
        </div>`;

      // Score inputs only on first round, both duplas present, admin mode
      if (isFirstRound && !aIsBye && !bIsBye && adminMode) {
        const gi = a.grupo_idx;
        html += `<div class="bracket-score-row">
          <input class="bscore-in" id="bsc-${scoreKey}-a" type="number" min="0" max="99" value="${esc(sc.sa)}" placeholder="—">
          <span class="bracket-vs">×</span>
          <input class="bscore-in" id="bsc-${scoreKey}-b" type="number" min="0" max="99" value="${esc(sc.sb)}" placeholder="—">
          <button class="slot-ok-btn" onclick="salvarPlacarBracket('${fase}',${gi},${a.grupo_idx},${b.grupo_idx})">OK</button>
        </div>`;
      } else {
        html += `<div class="bracket-vs">${aWon || bWon ? (sc.sa !== '' ? `${sc.sa} × ${sc.sb}` : 'VS') : 'VS'}</div>`;
      }

      html += `<div class="bracket-slot ${bWon ? 'won' : ''} ${aWon ? 'lost' : ''} ${bIsBye ? 'bye' : ''}">
          <span class="slot-name">${esc(nameB)}</span>
          ${bWon ? `<span class="slot-score-badge">${sc.sb}</span>` : ''}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

async function salvarPlacarBracket(fase, gi, giA, giB) {
  const key = `${fase}_${gi}`;
  const sa = parseInt(document.getElementById(`bsc-${key}-a`)?.value);
  const sb = parseInt(document.getElementById(`bsc-${key}-b`)?.value);
  if (isNaN(sa) || isNaN(sb)) { showToast('Preencha os dois placares', 'err'); return; }
  setBScore(fase, gi, sa, sb);

  // Determina vencedor automaticamente: maior placar vence
  const pool = fase === 'fase2' ? groups.fase2 : groups.consolacao.map((arr, i) => ({
    label: `C${i+1}`, grupo_idx: i, p1: arr[0]||null, p2: arr[1]||null, winner: arr.find(p=>p?.vencedor)||null
  }));
  const match = pool.find(d => d.grupo_idx === gi);
  if (!match) { showToast('Jogo não encontrado', 'err'); return; }
  if (sa === sb) { showToast('Placar empatado — defina o vencedor manualmente', 'err'); return; }

  const winner_id = sa > sb ? match.p1?.atleta_id : match.p2?.atleta_id;
  if (!winner_id) { showToast('Dupla sem atleta registrado', 'err'); return; }

  try {
    await apiPost('/g7/vencedor', { winner_id, fase, grupo_idx: gi });
    await loadData();
    showToast('Resultado salvo!', 'ok');
  } catch(e) { showToast('Erro: ' + e.message, 'err'); }
}

async function setWinner(idx, which) {
  const match = groups.fase2[idx];
  const winner = which === 'p1' ? match.p1 : match.p2;
  try {
    await apiPost('/g7/vencedor', { winner_id: winner.atleta_id, fase: 'fase2', grupo_idx: match.grupo_idx });
    await loadData();
    showToast(`Vencedor: ${winner.nome}`, 'ok');
  } catch(e) { showToast('Erro', 'err'); }
}

function esc(s) {
